[package]
name = "leangraph"
version = "0.0.1"
edition = "2021"
rust-version = "1.82"
description = "A code graph that gives a coding agent the relevant code instead of making it grep for it."
license = "MIT"
repository = "https://github.com/mathaiostop23/leangraph"
homepage = "https://github.com/mathaiostop23/leangraph"
readme = "README.md"
keywords = ["code-graph", "tree-sitter", "mcp", "static-analysis", "llm"]
categories = ["development-tools"]
# The benchmark corpora, the transcripts and the design notes are the largest
# things in the tree and none of them are needed to build. Without this the
# published crate carries them to everyone who installs it.
exclude = ["bench/", "*.md", "!README.md", ".github/", "Dockerfile", "docker-compose.yml"]

[[bin]]
name = "leangraph"
path = "src/main.rs"

[dependencies]
ignore = "0.4"
rayon = "1.10"
memmap2 = "0.9"
lasso = { version = "0.7", features = ["multi-threaded"] }
rustc-hash = "2"
blake3 = "1.5"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
tree-sitter = "0.26.12"
tree-sitter-python = "0.25.0"
tree-sitter-typescript = "0.23.2"
tree-sitter-rust = "0.24.2"
tree-sitter-go = "0.25.0"
tree-sitter-java = "0.23.5"
tree-sitter-c = "0.24.2"
tree-sitter-cpp = "0.23.4"
tree-sitter-c-sharp = "0.23.5"
tree-sitter-ruby = "0.23.1"
tree-sitter-php = "0.24.2"
tree-sitter-kotlin-ng = "1.1.0"
tree-sitter-swift = "0.7.3"
tree-sitter-scala = "0.26.2"

bytemuck = { version = "1.25.2", features = ["derive"] }
# `preserve_order` so merging into someone else's config does not reorder
# every key they wrote.
serde_json = { version = "1.0.151", features = ["preserve_order"] }
axum = "0.8.9"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "signal"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
hmac = "0.12.1"
sha2 = "0.10.9"
# GitHub's webhook UI defaults to form-encoded deliveries, which arrive as
# `payload=<urlencoded json>` rather than as a JSON body.
form_urlencoded = "1.2"
hex = "0.4.3"
subtle = "2.6.1"
time = "0.3.41"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
aes-gcm = "0.10.3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
