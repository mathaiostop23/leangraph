[package]
name = "arbor"
version = "0.0.1"
edition = "2021"
rust-version = "1.80"

[[bin]]
name = "arbor"
path = "src/main.rs"

[dependencies]
ignore = "0.4"
rayon = "1.10"
memmap2 = "0.9"
lasso = { version = "0.7", features = ["multi-threaded"] }
rustc-hash = "2"
blake3 = "1.5"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
tree-sitter = "0.26.12"
tree-sitter-python = "0.25.0"
tree-sitter-typescript = "0.23.2"
bytemuck = { version = "1.25.2", features = ["derive"] }
serde_json = "1.0.151"
axum = "0.8.9"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "signal"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
hmac = "0.12.1"
sha2 = "0.10.9"
hex = "0.4.3"
subtle = "2.6.1"
time = "0.3.41"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
