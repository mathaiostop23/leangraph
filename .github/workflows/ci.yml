name: ci

# Everything here runs without the benchmark corpora. Those are ~1 GB of
# clones and the numbers they produce belong in BENCH.md, measured on one
# machine; what CI is for is catching the changes that break something
# silently, and all of those are reachable from this repository alone.
on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: format
        run: cargo fmt --check

      - name: build
        run: cargo build --release --locked

      # Includes the two that matter most for a project with fourteen language
      # specs: every node kind and field name a spec asks for must exist in its
      # grammar, and every language must define and call something. A grammar
      # upgrade that renames a node otherwise breaks a language with no error —
      # `kinds()` drops the name, the spec still compiles, and that language
      # quietly stops finding whatever the node was for.
      - name: test
        run: cargo test --release --locked

      - name: clippy
        run: cargo clippy --release --locked -- -D warnings

  behaviour:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked

      # This repository is Rust, which the indexer now supports, so it can be
      # its own corpus. Small, always present, and exercises the whole pipeline.
      - name: index itself
        run: |
          # The output is coloured, so the escape codes sit between the label
          # and the number. Strip them before asserting, or the check passes
          # only by accident on a terminal that has none.
          ./target/release/leangraph index . 2>&1 | sed 's/\x1b\[[0-9;]*m//g' | tee /tmp/out.txt
          nodes=$(grep -oE 'graph +[0-9]+ nodes' /tmp/out.txt | grep -oE '[0-9]+')
          echo "nodes: ${nodes:-none}"
          [ "${nodes:-0}" -gt 300 ] || {
            echo "::error::indexing this repository produced ${nodes:-no} nodes"; exit 1; }

      # The invariant that makes incremental sync safe to trust: a sync must
      # produce a graph semantically identical to a full reindex. It found that
      # the graph was not reproducible at all the first time it ran.
      - name: convergence
        run: bash bench/converge.sh .

      # A rate limit must not lose the issue and a killed process must not
      # strand its job. Both failed silently before this existed, and neither
      # is visible from a unit test — it takes a real server, a real queue,
      # and an API that actually refuses.
      - name: retry and recovery
        run: python3 bench/retry_test.py .

      # A second provider is where a security gate quietly comes out
      # different. This runs the same ground the GitHub suite covers, against
      # GitLab's payload shape, plus the member lookup that has no counterpart
      # there and is the one gate here that could fail open.
      - name: gitlab
        run: python3 bench/gitlab_test.py .

      # The webhook gates and the agent's prompt safety, against stubs. These
      # need a live server and a repository that has answered two different
      # issues, which is why they stopped being run by hand.
      - name: webhook gates and agent assertions
        run: bash bench/server_test.sh .

      - name: deduplication
        run: python3 bench/dedup_test.py .

      # Every language must still extract and resolve. A fixture rather than a
      # corpus, but it is the difference between "the spec compiles" and "the
      # spec works".
      - name: every language still works
        run: bash bench/langsmoke.sh
